<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Page title -->
  <title>Password Generator</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= PASSWORD DISPLAY BOX ================= -->
  <div class="inputbox">
    <!-- Generated password will appear here -->
    <input type="text" id="display">

    <!-- Copy password icon -->
    <img src="assets/copy.png" alt="Copy Password" id="copy">
  </div>

  <!-- ================= MAIN CONTAINER ================= -->
  <div class="container">

    <!-- ===== Password Length Section ===== -->
    <div class="top">
      <div class="top1">
        <h4>Character Length</h4>
        <!-- Current length value -->
        <span id="length">9</span>
      </div>

      <!-- Range slider to control password length -->
      <input type="range" id="range" min="6" max="12">
    </div>

    <!-- ===== Character Options ===== -->
    <div class="options">
      <input type="checkbox" id="uppercase">
      <label for="uppercase">Include Uppercase Letters</label>
    </div>

    <div class="options">
      <input type="checkbox" id="lowercase">
      <label for="lowercase">Include Lowercase Letters</label>
    </div>

    <div class="options">
      <input type="checkbox" id="number">
      <label for="number">Include Numbers</label>
    </div>

    <div class="options">
      <input type="checkbox" id="symbol">
      <label for="symbol">Include Symbols</label>
    </div>

    <!-- ===== Strength Indicator ===== -->
    <div class="lastbox">
      <input type="text" id="strength" value="STRENGTH">
    </div>

    <!-- ===== Generate Button ===== -->
    <div class="lastbox">
      <button id="generate">Generate Password</button>
    </div>

  </div>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
